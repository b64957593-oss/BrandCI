<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BrandCI · Brand governance as CI/CD</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0A12;--sf:rgba(22,22,36,.72);--el:#1B1B2A;--bd:rgba(255,255,255,.09);--tx:#F4F4FA;--mu:#9A9AB3;--v:#7C5CFF;--c:#22D3EE;--g:#10D9A0;--a:#FFB020;--r:#FF4D6D;--m:#E040FB;--grad:linear-gradient(135deg,#7C5CFF,#22D3EE)}
@media (prefers-color-scheme:light){:root{--bg:#F4F2EC;--sf:rgba(255,255,255,.82);--el:#fff;--bd:rgba(17,17,15,.12);--tx:#11110F;--mu:#5B605C}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 "DM Sans",sans-serif;min-height:100vh;overflow-x:hidden}
.bl{position:fixed;border-radius:50%;filter:blur(90px);opacity:.33;pointer-events:none;z-index:0;animation:dr 24s ease-in-out infinite alternate}
.b1{width:480px;height:480px;background:var(--v);top:-120px;left:-100px}
.b2{width:420px;height:420px;background:var(--c);top:30%;right:-140px;animation-delay:-8s}
.b3{width:380px;height:380px;background:var(--m);bottom:-120px;left:30%;animation-delay:-15s}
@keyframes dr{to{transform:translate(70px,50px) scale(1.15)}}
main{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:18px 18px 80px}
nav{display:flex;align-items:center;gap:10px;padding:6px 0 26px}
.wm{font:700 19px "Space Grotesk";letter-spacing:-.03em}
.sp{flex:1}
h1{font:700 clamp(38px,8vw,80px)/1 "Space Grotesk";letter-spacing:-.04em;margin:0 0 14px}
h1 i{font:italic 400 1.05em "Instrument Serif";background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
h1 span{display:inline-block;animation:rise .8s cubic-bezier(.23,1,.32,1) both;animation-delay:calc(var(--i)*70ms)}
h2{font:600 24px "Space Grotesk";letter-spacing:-.02em;margin:0 0 4px}
.sub{color:var(--mu);max-width:560px;margin:0 0 26px}
@keyframes rise{from{opacity:0;transform:translateY(16px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.in>*{animation:rise .55s cubic-bezier(.23,1,.32,1) both;animation-delay:calc(var(--i,0)*45ms)}
.stp{display:flex;gap:0;margin:0 0 26px;position:relative}
.stp div{flex:1;font:500 12px "DM Sans";color:var(--mu);padding-top:20px;position:relative;transition:.4s}
.stp div::before{content:"";position:absolute;top:4px;left:0;width:100%;height:3px;background:var(--bd);border-radius:3px}
.stp div::after{content:"";position:absolute;top:4px;left:0;height:3px;width:0;background:var(--grad);border-radius:3px;transition:width .7s cubic-bezier(.23,1,.32,1)}
.stp .on,.stp .ok{color:var(--tx)}.stp .on::after,.stp .ok::after{width:100%}
.stp .on::before{box-shadow:0 0 14px var(--v)}
.gl{background:var(--sf);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--bd);border-radius:20px;padding:18px;margin-bottom:12px;transition:.3s}
.gl:hover{border-color:rgba(124,92,255,.45);box-shadow:0 10px 40px -14px var(--v)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
label.t{display:block;font-weight:500;font-size:13px;color:var(--mu);margin-bottom:6px}
textarea,input[type=text]{width:100%;background:var(--el);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:11px 13px;font:14px/1.5 "DM Sans";transition:.2s}
textarea{min-height:240px;resize:vertical;font-family:"JetBrains Mono",monospace;font-size:12.5px}
textarea:focus,input:focus{outline:none;border-color:var(--v);box-shadow:0 0 0 3px rgba(124,92,255,.25)}
button:focus-visible,label.btn:focus-within{outline:2px solid var(--c);outline-offset:3px}
button,.btn{position:relative;overflow:hidden;font:500 14px "DM Sans";border:0;border-radius:999px;padding:11px 22px;background:var(--grad);color:#fff;cursor:pointer;transition:transform .16s cubic-bezier(.23,1,.32,1),box-shadow .3s;display:inline-block}
button:hover{box-shadow:0 8px 26px -8px var(--v)}button:active{transform:scale(.97)}
button::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);animation:sh 3.5s infinite}
@keyframes sh{to{transform:translateX(120%)}}
button.o,.btn.o{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.o::after{display:none}
button.o:hover,.btn.o:hover{border-color:var(--c);box-shadow:none}
button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0}
.line{display:flex;gap:8px;margin-bottom:8px}.x{flex:none;padding:8px 16px}
.pill{font:700 11px "DM Sans";padding:4px 11px;border-radius:99px;color:#fff;letter-spacing:.05em;display:inline-block;animation:pop .5s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.High{background:var(--r);box-shadow:0 0 14px rgba(255,77,109,.55)}.Medium{background:var(--a);color:#222}.Low{background:var(--g);color:#06251c}
.err{background:rgba(255,77,109,.12);border:1px solid var(--r);color:var(--r);border-radius:14px;padding:12px 14px;margin:12px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ag{display:flex;gap:14px;align-items:center}.ag b{font:600 15px "Space Grotesk"}
.beam{height:46px;border-radius:12px;position:relative;overflow:hidden;background:repeating-linear-gradient(0deg,var(--bd) 0 8px,transparent 8px 16px);flex:1}
.beam::after{content:"";position:absolute;top:0;bottom:0;width:60px;background:linear-gradient(90deg,transparent,var(--c),transparent);animation:bm 1.4s ease-in-out infinite}
@keyframes bm{from{left:-60px}to{left:100%}}
.v{border-radius:22px;padding:22px 26px;margin-bottom:16px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;position:relative;overflow:visible}
.v.BLOCK{background:linear-gradient(135deg,#FF4D6D,#c2185b)}.v.REVIEW{background:linear-gradient(135deg,#FFB020,#e67e22);color:#222}.v.PASS{background:linear-gradient(135deg,#10D9A0,#0ea5a5);color:#06251c}
.v b{font:700 clamp(34px,7vw,54px) "Space Grotesk";letter-spacing:-.03em;animation:st .7s cubic-bezier(.2,1.2,.3,1) both}
@keyframes st{from{opacity:0;transform:scale(1.7) rotate(-7deg)}to{opacity:1;transform:none}}
.cn{display:flex;gap:18px;font:600 14px "DM Sans"}.cn span{background:rgba(0,0,0,.2);padding:6px 14px;border-radius:99px}
.tw{overflow-x:auto;border-radius:16px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}
th,td{text-align:left;padding:12px;border-bottom:1px solid var(--bd);vertical-align:top}
th{font:600 11px "DM Sans";text-transform:uppercase;letter-spacing:.07em;color:var(--mu)}
tbody tr{transition:.2s;box-shadow:inset 0 0 0 var(--v)}tbody tr:hover{background:rgba(124,92,255,.08);box-shadow:inset 3px 0 0 var(--v)}
.sg{color:var(--g);font-weight:500}small,.mu{color:var(--mu)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
pre{background:var(--el);border:1px solid var(--bd);border-radius:16px;padding:16px;overflow:auto;max-height:360px;font:12.5px/1.6 "JetBrains Mono",monospace;margin:0}
.sw{display:flex;gap:10px;align-items:center;font-size:13px;margin-top:8px}.sw input{accent-color:#7C5CFF;width:18px;height:18px}
.ex{font:700 10px "DM Sans";background:var(--a);color:#222;padding:3px 9px;border-radius:99px;margin-left:8px;animation:pop .5s both}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--grad);color:#fff;padding:12px 22px;border-radius:99px;z-index:9;animation:rise .4s both}
.warn{background:rgba(255,176,32,.14);border:1px solid var(--a);color:var(--a);border-radius:14px;padding:10px 14px;margin-bottom:16px;font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bl b1"></div><div class="bl b2"></div><div class="bl b3"></div>
<main>
<nav>
<svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7C5CFF"/><stop offset="1" stop-color="#22D3EE"/></linearGradient></defs><path d="M22.2 7.6V24.4H3.6V3.6H17.8" stroke="currentColor" stroke-width="1.2" stroke-linecap="square" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur="1.2s" fill="freeze"/></path><rect x="16.6" y="1.9" width="8.4" height="3.2" fill="url(#g)"/></svg>
<span class="wm">BRANDCI</span><span class="sp"></span>
<button class="o" onclick="view('app')">New run</button><button class="o" onclick="hist()">History</button><button class="o" onclick="st.mode='set';render()">Settings</button>
</nav>
<div id="root"></div>
</main>
<script>
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var SM={src:"Instagram caption:\nMeet AuraGlow Serum. Removes wrinkles in 3 days!! Clinically proven for all skin types. Contains 2% niacinamide. Dermatologists love it.\n\nLaunch email:\nSubject: Your best skin ever, guaranteed\nAuraGlow is the number 1 serum in India. Results you can see overnight. Use code GLOW20 for 20% off.\n(Image: before/after photo, no alt text)",
ref:"BRAND GUIDELINES v3.1\n4.2 No absolute efficacy claims (removes, cures, guaranteed). Use reduces / visibly improves.\n2.7 Claims must match the scope of the study that supports them.\n5.1 Superlatives (number 1, best) need a cited third-party ranking.\n6.3 All images must include descriptive alt text.\n7.1 Tone: calm, expert, no exclamation marks, no hype.\n\nAPPROVED FACTS\n- AuraGlow Serum: 40-person study, visible reduction in fine lines after 4 weeks of daily use. Tested on normal and dry skin only.\n- Formulation: 2% niacinamide.\n- No dermatologist endorsement agreement is on file.\n- (EXPIRED 2024) Retail ranking claim: top 5 serum in Q1 2024."};
var st={mode:"app",step:1,src:"",ref:"",source:null,pairs:[],results:[],extra:[],busy:"",agent:"",err:"",tab:"validate.json",last:null,hist:[],keyOk:false,toast:""};
var NAMES=["Input","Extract + creator check","Match + reviewer check","Validate + output"];
var cfg={p:"groq",key:"",model:"openai/gpt-oss-120b"};try{cfg=Object.assign(cfg,JSON.parse(localStorage.getItem("bci_cfg")||"{}"))}catch(e){}
var BASES={groq:"https://api.groq.com/openai/v1",gemini:"https://generativelanguage.googleapis.com/v1beta/openai"},MD={groq:"openai/gpt-oss-120b",gemini:"gemini-3.5-flash"};
var EXTRACT="You are the Extraction Agent of BrandCI, a brand-governance pipeline. From the SOURCE CONTENT, collect and structure only quantitative or important-looking factual claims that must be validated before publication (also include implied claims like superlatives or endorsements). Return ONLY JSON: {\"product_name\":string,\"statements\":[string],\"context\":[string]} where context lists qualifications, channels or conditions found in the source.";
var MATCH="You are the Evidence Agent of BrandCI. For each STATEMENT, find the single most relevant approved fact and the guideline rule that governs it from the REFERENCES. If no fact exists write \"NO MATCHING FACT FOUND\". Set expired=true if the reference marks that evidence expired or outdated. Return ONLY JSON: {\"matches\":[{\"statement\":string,\"fact\":string,\"guideline\":string,\"expired\":boolean}]} with one entry per statement, same order.";
var VALIDATE="You are the Governance Agents of BrandCI. Validate each statement against its fact using the guidelines. Give risk Low, Medium or High (High = false, absolute, unsupported or non-compliant). Explain why it was flagged and cite the guideline. Write a compliant suggested rewrite. Also detect tone, language, visual-usage and accessibility issues in the SOURCE that are not tied to one claim. Return ONLY JSON: {\"results\":[{\"statement\":string,\"fact\":string,\"risk\":\"Low|Medium|High\",\"reason\":string,\"guideline\":string,\"suggested\":string}],\"extra\":[{\"issue\":string,\"risk\":\"Low|Medium|High\",\"reason\":string,\"guideline\":string,\"suggested\":string}]}";
function pj(t){t=t.replace(/^```(?:json)?|```$/gm,"").trim();try{return JSON.parse(t)}catch(e){var m=t.match(/\{[\s\S]*\}/);if(!m)throw e;return JSON.parse(m[0])}}
async function llm(sys,user){
if(!cfg.key)throw new Error("No API key yet. Open Settings and paste your key.");
var body={model:cfg.model,temperature:.2,messages:[{role:"system",content:sys+" Respond with valid JSON only, no markdown."},{role:"user",content:user}],response_format:{type:"json_object"}};
for(var i=0;i<3;i++){var r;try{r=await fetch(BASES[cfg.p]+"/chat/completions",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+cfg.key},body:JSON.stringify(body)})}catch(e){throw new Error("Could not reach the AI provider. Check internet and key.")}
if(r.status==400&&body.response_format){delete body.response_format;continue}
if(r.status==429)throw new Error("Rate limit hit. Wait a minute and retry.");
if(r.status==401||r.status==403)throw new Error("API key rejected. Check it in Settings.");
if(r.status==404)throw new Error("Model not found. Fix the model name in Settings.");
if(!r.ok)throw new Error("AI provider error "+r.status);
try{var j=await r.json();return pj(j.choices[0].message.content)}catch(e){}}
throw new Error("AI returned invalid JSON. Retry.")}
function getRuns(){try{return JSON.parse(localStorage.getItem("bci_runs")||"[]")}catch(e){return[]}}
function setRuns(r){try{localStorage.setItem("bci_runs",JSON.stringify(r))}catch(e){}}
async function api(p,b,m){
if(p=="extract"){var d=await llm(EXTRACT,"SOURCE CONTENT:\n"+String(b.source_text).slice(0,20000));return{product_name:d.product_name||"Product",statements:d.statements||[],context:d.context||[]}}
if(p=="match"){var d=await llm(MATCH,"STATEMENTS:\n"+JSON.stringify(b.statements)+"\n\nREFERENCES:\n"+String(b.reference_text).slice(0,20000));var ms=d.matches||[];return{matches:b.statements.map(function(s,i){var x=ms[i]||{};return{statement:s,fact:x.fact||"NO MATCHING FACT FOUND",guideline:x.guideline||"",expired:!!x.expired}})}}
if(p=="validate"){var d=await llm(VALIDATE,"PAIRS:\n"+JSON.stringify(b.pairs)+"\n\nGUIDELINES AND REFERENCES:\n"+String(b.reference_text).slice(0,12000)+"\n\nSOURCE:\n"+String(b.source_text).slice(0,12000));return{results:d.results||[],extra:d.extra||[]}}
var R=getRuns();
if(p=="runs"&&b){R.push({id:Date.now(),created_at:new Date().toLocaleString(),product:b.product,verdict:b.verdict,data:b.data});setRuns(R);return{id:1}}
if(p=="runs")return R.map(function(r){return{id:r.id,created_at:r.created_at,product:r.product,verdict:r.verdict}}).reverse();
var id=+p.split("/")[1];
if(m=="DELETE"){setRuns(R.filter(function(r){return r.id!=id}));return{ok:1}}
var r=R.find(function(r){return r.id==id});if(!r)throw new Error("Run not found");return r.data}
function saveCfg(){cfg={p:$("#pv").value,key:$("#ky").value.trim(),model:$("#md").value.trim()||MD[$("#pv").value]};try{localStorage.setItem("bci_cfg",JSON.stringify(cfg))}catch(e){}st.keyOk=!!cfg.key;st.err="";view("app")}
st.keyOk=!!cfg.key;
function run(agent,label,fn){st.last=function(){run(agent,label,fn)};return(async function(){st.busy=label;st.agent=agent;st.err="";render();try{await fn()}catch(e){st.err=e.message||"Something failed"}st.busy="";render()})()}
function retry(){if(st.last)st.last()}
function go(n){st.step=n;render();window.scrollTo(0,0)}
function view(m){st.mode=m;if(m=="app"){st.step=1;st.source=null;st.pairs=[];st.results=[];st.extra=[];st.err=""}render()}
function sample(){st.src=SM.src;st.ref=SM.ref;render()}
function upload(k,inp){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){st[k]=(st[k]?st[k]+"\n\n":"")+r.result;render()};r.readAsText(f)}
function extract(){run("Extraction Agent","Reading claims…",async function(){var d=await api("extract",{source_text:st.src});st.source=d;st.step=2})}
function match(){run("Evidence Agent","Cross-checking guidelines…",async function(){var d=await api("match",{statements:st.source.statements,reference_text:st.ref});st.pairs=d.matches.map(function(m){return{statement:m.statement,fact:m.fact,guideline:m.guideline,expired:m.expired,keep:!m.expired}});st.step=3})}
function validate(){run("Governance Agents","Scoring risk on every claim…",async function(){
var pairs=st.pairs.map(function(p){return{statement:p.statement,fact:p.keep?p.fact:"NO MATCHING FACT FOUND (evidence removed by reviewer)",guideline:p.guideline}});
var d=await api("validate",{pairs:pairs,source_text:st.src,reference_text:st.ref});st.results=d.results;st.extra=d.extra;st.tab="validate.json";st.step=4;
try{await api("runs",{product:st.source.product_name,verdict:verdict()[0],data:{src:st.src,ref:st.ref,source:st.source,pairs:st.pairs,results:st.results,extra:st.extra}})}catch(e){}})}
function files(){var n=st.source.product_name,k=st.pairs.filter(function(p){return p.keep});
return{"source.json":st.source,"reference.json":{product_name:n,statements:k.map(function(p){return p.fact}),context:k.map(function(p){return p.guideline}).filter(Boolean)},
"validate.json":st.results.map(function(r){return{product_name:n,statement:r.statement,fact:r.fact,risk:r.risk,reason:r.reason,guideline:r.guideline}}).concat(st.extra.map(function(r){return{product_name:n,statement:r.issue,fact:"",risk:r.risk,reason:r.reason,guideline:r.guideline}})),
"suggestions.json":st.results.concat(st.extra).map(function(r){return{statement:r.statement||r.issue,suggested:r.suggested}})}}
function save(name,data){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download=name;a.click();toast("Saved "+name)}
function toast(t){st.toast=t;render();setTimeout(function(){st.toast="";render()},2200)}
function copyTab(){navigator.clipboard.writeText(JSON.stringify(files()[st.tab],null,2)).then(function(){toast("Copied")})}
function verdict(){var a=st.results.concat(st.extra);return a.some(function(r){return r.risk=="High"})?["BLOCK","At least one high-risk claim. Do not publish."]:a.some(function(r){return r.risk=="Medium"})?["REVIEW","Medium-risk items need an approver."]:["PASS","All claims match approved facts."]}
function setS(i,v){st.source.statements[i]=v}function setP(i,k,v){st.pairs[i][k]=v}
function delS(i){st.source.statements.splice(i,1);render()}
function addS(){var v=$("#ns").value.trim();if(v){st.source.statements.push(v);render()}}
function togP(i,v){st.pairs[i].keep=v;var c=document.querySelectorAll(".pc")[i];if(c)c.style.cssText=v?"":"opacity:.55;transform:scale(.98)"}
function hist(){st.mode="hist";api("runs").then(function(d){st.hist=d;render()}).catch(function(e){st.err=e.message;render()});render()}
function openRun(id){api("runs/"+id).then(function(d){st.src=d.src;st.ref=d.ref;st.source=d.source;st.pairs=d.pairs;st.results=d.results;st.extra=d.extra;st.mode="app";st.step=4;render()})}
function delRun(id){api("runs/"+id,null,"DELETE").then(hist)}
function count(){document.querySelectorAll("[data-n]").forEach(function(e){var n=+e.dataset.n,t0=performance.now();(function f(t){var p=Math.min(1,(t-t0)/800);e.textContent=Math.round(n*p)+" "+e.dataset.l;if(p<1)requestAnimationFrame(f)})(t0)})}
function render(){var h="",e=st.err?'<div class="err" role="alert">'+esc(st.err)+(st.last&&st.mode=="app"?' <button class="o" onclick="retry()">Retry</button>':"")+"</div>":"";
var warn=st.keyOk?"":'<div class="warn">No API key yet. <button class="o" style="padding:6px 14px" onclick="st.mode=\'set\';render()">Open Settings</button></div>';
if(st.mode=="set"){h='<div class="in"><h2 style="--i:0">Settings</h2><p class="mu" style="--i:1;margin:0 0 14px">Your key stays in this browser only. It is sent to the AI provider and nowhere else.</p><div class="gl" style="--i:2"><label class="t" for="pv">Provider</label><select id="pv" onchange="$(\'#md\').value=MD[this.value]" style="width:100%;background:var(--el);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:11px 13px;font:14px DM Sans,sans-serif"><option value="groq"'+(cfg.p=="groq"?" selected":"")+'>Groq (free, recommended)</option><option value="gemini"'+(cfg.p=="gemini"?" selected":"")+'>Google Gemini (free)</option></select><label class="t" for="ky" style="margin-top:12px">API key</label><input type="text" id="ky" value="'+esc(cfg.key)+'" placeholder="paste your key" autocomplete="off"><label class="t" for="md" style="margin-top:12px">Model</label><input type="text" id="md" value="'+esc(cfg.model)+'"></div><div class="row"><button onclick="saveCfg()">Save</button></div></div>';$("#root").innerHTML=h;return}
if(st.mode=="hist"){h='<div class="in"><h2 style="--i:0">History</h2>'+(st.hist.length?st.hist.map(function(r,i){return'<div class="gl" style="--i:'+(i+1)+';display:flex;gap:12px;align-items:center;flex-wrap:wrap"><span class="pill '+(r.verdict=="BLOCK"?"High":r.verdict=="REVIEW"?"Medium":"Low")+'">'+esc(r.verdict)+'</span><b style="flex:1">'+esc(r.product)+'</b><small>'+esc(r.created_at)+'</small><button class="o" onclick="openRun('+r.id+')">Open</button><button class="o" onclick="delRun('+r.id+')">Delete</button></div>'}).join(""):'<p class="mu">No runs yet. Finish one and it shows up here.</p>')+"</div>"+e;$("#root").innerHTML=h;return}
var steps='<div class="stp">'+NAMES.map(function(n,i){return'<div class="'+(i+1==st.step?"on":i+1<st.step?"ok":"")+'">0'+(i+1)+" "+n+"</div>"}).join("")+"</div>";
if(st.step==1&&!st.source){h='<h1><span style="--i:0">Brand</span> <span style="--i:1">governance,</span><br><span style="--i:2">as</span> <span style="--i:3"><i>CI/CD.</i></span></h1><p class="sub">Paste content and brand references. AI extracts claims, matches approved facts, scores the risk and explains every flag. You approve at two checkpoints.</p>'}
var body="";
if(st.busy){body='<div class="gl ag"><div><b>'+esc(st.agent)+'</b><div class="mu" style="font-size:13px">'+esc(st.busy)+'</div></div><div class="beam"></div></div>'}
else if(st.step==1){var ok=st.src.trim()&&st.ref.trim();body='<div class="in"><div class="row" style="--i:0"><button class="o" onclick="sample()">Load sample</button></div><div class="cols" style="--i:1"><div class="gl"><label class="t" for="src">Source content (captions, emails, copy)</label><textarea id="src" oninput="st.src=this.value;$(\'#go\').disabled=!(st.src.trim()&&st.ref.trim())">'+esc(st.src)+'</textarea><label class="btn o" style="margin-top:10px">Upload file<input type="file" accept=".txt,.md,.csv,.json" hidden onchange="upload(\'src\',this)"></label></div><div class="gl"><label class="t" for="ref">Brand references (guidelines, approved facts)</label><textarea id="ref" oninput="st.ref=this.value;$(\'#go\').disabled=!(st.src.trim()&&st.ref.trim())">'+esc(st.ref)+'</textarea><label class="btn o" style="margin-top:10px">Upload file<input type="file" accept=".txt,.md,.csv,.json" hidden onchange="upload(\'ref\',this)"></label></div></div><div class="row" style="--i:2"><button id="go" onclick="extract()"'+(ok?"":" disabled")+'>Extract claims →</button></div></div>'}
else if(st.step==2){var s=st.source;body='<div class="in"><h2 style="--i:0">Creator checkpoint</h2><p class="mu" style="--i:1;margin:0 0 14px">Edit, remove or add claims the agent missed.</p><div class="gl" style="--i:2"><label class="t" for="pn">Product</label><input type="text" id="pn" value="'+esc(s.product_name)+'" oninput="st.source.product_name=this.value"></div><div class="gl" style="--i:3">'+s.statements.map(function(x,i){return'<div class="line"><input type="text" value="'+esc(x)+'" aria-label="Claim '+(i+1)+'" oninput="setS('+i+',this.value)"><button class="o x" onclick="delS('+i+')" aria-label="Remove">×</button></div>'}).join("")+'<div class="line"><input type="text" id="ns" placeholder="Add a missing claim"><button class="o x" onclick="addS()">Add</button></div></div>'+(s.context.length?'<p class="mu" style="font-size:13px">Context: '+esc(s.context.join(" · "))+"</p>":"")+'<div class="row"><button class="o" onclick="go(1)">← Back</button><button onclick="match()"'+(s.statements.length?"":" disabled")+'>Confirm and match references →</button></div></div>'}
else if(st.step==3){body='<div class="in"><h2 style="--i:0">Reviewer checkpoint</h2><p class="mu" style="--i:1;margin:0 0 14px">Confirm each fact. Switch off evidence that is wrong or expired.</p>'+st.pairs.map(function(p,i){return'<div class="gl pc" style="--i:'+(i+2)+(p.keep?"":";opacity:.55;transform:scale(.98)")+'"><b>'+esc(p.statement)+"</b>"+(p.expired?'<span class="ex">EXPIRED</span>':"")+'<textarea style="min-height:70px;margin:10px 0;font-family:DM Sans;font-size:14px" aria-label="Fact" oninput="setP('+i+',\'fact\',this.value)">'+esc(p.fact)+'</textarea><input type="text" value="'+esc(p.guideline)+'" placeholder="Guideline" aria-label="Guideline" oninput="setP('+i+',\'guideline\',this.value)"><label class="sw"><input type="checkbox" '+(p.keep?"checked":"")+' onchange="togP('+i+',this.checked)"> Use this evidence</label></div>'}).join("")+'<div class="row"><button class="o" onclick="go(2)">← Back</button><button onclick="validate()">Confirm and validate →</button></div></div>'}
else{var v=verdict(),all=st.results.concat(st.extra.map(function(x){return{statement:x.issue,fact:"(whole-content check)",risk:x.risk,reason:x.reason,guideline:x.guideline,suggested:x.suggested}})),F=files(),c={High:0,Medium:0,Low:0};all.forEach(function(r){if(c[r.risk]!=null)c[r.risk]++});
body='<div class="in"><div class="v '+v[0]+'" style="--i:0"><b>'+v[0]+'</b><div style="flex:1;min-width:180px">'+v[1]+'</div><div class="cn"><span data-n="'+c.High+'" data-l="High">0</span><span data-n="'+c.Medium+'" data-l="Medium">0</span><span data-n="'+c.Low+'" data-l="Low">0</span></div></div><div class="gl tw" style="--i:1;padding:6px"><table><thead><tr><th>Claim</th><th>Approved fact</th><th>Risk</th><th>Why flagged</th><th>Suggested fix</th></tr></thead><tbody>'+all.map(function(r){return"<tr><td>"+esc(r.statement)+"</td><td>"+esc(r.fact)+'</td><td><span class="pill '+esc(r.risk)+'">'+esc(String(r.risk).toUpperCase())+"</span></td><td>"+esc(r.reason)+"<br><small>"+esc(r.guideline)+'</small></td><td class="sg">'+esc(r.suggested)+"</td></tr>"}).join("")+'</tbody></table></div><h2 style="--i:2;margin-top:28px">Output files</h2><div class="tabs" style="--i:3">'+Object.keys(F).map(function(k){return'<button class="'+(k==st.tab?"":"o")+'" onclick="st.tab=\''+k+'\';render()">'+k+"</button>"}).join("")+'</div><pre style="--i:4">'+esc(JSON.stringify(F[st.tab],null,2))+'</pre><div class="row"><button onclick="save(st.tab,files()[st.tab])">Download '+st.tab+'</button><button class="o" onclick="save(\'brandci-report.json\',files())">Download all</button><button class="o" onclick="copyTab()">Copy</button><button class="o" onclick="view(\'app\')">New run</button></div></div>'}
$("#root").innerHTML=h+warn+(st.step>1||st.source?steps:"")+body+e+(st.toast?'<div class="toast">'+esc(st.toast)+"</div>":"");
if(st.step==4&&!st.busy&&!st.toast)count()}
render();
</script>
</body>
</html>
